<div class="container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->
      
        <!-- Position Column -->
        <ng-container matColumnDef="data">
          <th mat-header-cell *matHeaderCellDef> Data </th>
          <td mat-cell *matCellDef="let element"> {{element.data.substring(0,10)}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="horaInicial">
          <th mat-header-cell *matHeaderCellDef> Hora Inicial </th>
          <td mat-cell *matCellDef="let element"> {{element.horaInicial.substring(11,19)}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="horaFinal">
           <th mat-header-cell *matHeaderCellDef> Hora Final </th>
           <td mat-cell *matCellDef="let element"> {{element.horaFinal.substring(11,19)}} </td>
        </ng-container>

         <!-- Name Column -->
         <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef> total </th>
            <td mat-cell *matCellDef="let element"> {{element.total}} </td>
         </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
</div>
